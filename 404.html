<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة - Team Cyber Force</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #05080f;
      color: #e8eef7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 8rem;
      background: linear-gradient(90deg, #00a3ff, #66d9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    p { color: #7d8aa1; font-size: 1.2rem; margin-bottom: 30px; }
    a {
      display: inline-block;
      padding: 14px 32px;
      border: 2px solid #00a3ff;
      color: #00a3ff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s;
    }
    a:hover { background: #00a3ff; color: #05080f; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>الصفحة اللي بتدور عليها مش موجودة</p>
    <a href="/team-cyber-force-/">🏠 ارجع للرئيسية</a>
  </div>
</body>
</html>
